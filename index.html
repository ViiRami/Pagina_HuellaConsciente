<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Huella Consciente</title><style>
html,body{margin:0;padding:0;width:100%;min-height:100%;overflow-x:hidden;background:#dce9de}
.view{position:relative;width:100%;height:0;overflow:hidden;visibility:hidden;pointer-events:none}
.view.active{visibility:visible;pointer-events:auto}
.view iframe{display:block;position:absolute;top:0;left:0;width:1920px;max-width:none;border:0;background:transparent;transform-origin:top left}
</style></head><body>
<section class="view active" id="home"><iframe id="homeFrame" title="home" scrolling="no" src="Pagina_Principal_HC%20-%20Copia/publication-web-resources/html/publication.html"></iframe></section>
<section class="view" id="laws"><iframe id="lawsFrame" title="laws" scrolling="no" src="Pagina_leyes/publication-web-resources/html/publication.html"></iframe></section>
<section class="view" id="informate"><iframe id="informateFrame" title="informate" scrolling="no" src="Pagina_Informate/publication-web-resources/html/publication.html"></iframe></section>
<section class="view" id="contact"><iframe id="contactFrame" title="contact" scrolling="no" src="Contacto/publication-web-resources/html/publication.html"></iframe></section>
<script>
const WIDTH=1920;
const pages={home:{height:3800},laws:{height:3701},informate:{height:3525},contact:{height:2200}};
const ready={};let activePage='home';let pendingPage=null;
let breadcrumbTrail=['home'];
function fit(key){
 const frame=document.getElementById(key+'Frame'),section=document.getElementById(key);
 const scale=document.documentElement.clientWidth/WIDTH;
 frame.style.width=WIDTH+'px';frame.style.maxWidth='none';frame.style.height=pages[key].height+'px';
 frame.style.transform='scale('+scale+')';
 section.style.height=key===activePage?(pages[key].height*scale)+'px':'0px';
}
function activate(key){
 if(!pages[key])return;
 if(!ready[key]){pendingPage=key;return;}
 pendingPage=null;
 // Volver arriba mientras la página anterior sigue visible; evita un fotograma blanco.
 window.scrollTo({top:0,left:0,behavior:'instant'});
 activePage=key;
 // El cambio de visibilidad y altura ocurre junto, sin descargar iframes.
 Object.keys(pages).forEach(k=>{fit(k);document.getElementById(k).classList.toggle('active',k===key);});
}
function broadcastBreadcrumb(){
 Object.keys(pages).forEach(key=>{
  if(ready[key])document.getElementById(key+'Frame').contentWindow.postMessage({type:'HC_BREADCRUMB_UPDATE',trail:breadcrumbTrail},'*');
 });
}
Object.keys(pages).forEach(key=>{
 const frame=document.getElementById(key+'Frame');
 frame.addEventListener('load',()=>{ready[key]=true;fit(key);frame.contentWindow.postMessage({type:'HC_BREADCRUMB_UPDATE',trail:breadcrumbTrail},'*');if(pendingPage===key)activate(key);});
 fit(key);
});
// Positions measured from the actual InDesign export (1920px wide).
// Buscador begins at y=1031.224; Juego begins at y=2082.421.
const sectionY={buscador:1000,juego:2025};
let lastDeepLinkAt=0;
let pendingDeepLink=null;
function jumpToSection(page,target){
 if(page!=='informate'||!(target in sectionY))return;
 const scale=document.documentElement.clientWidth/WIDTH;
 const y=Math.round(sectionY[target]*scale);
 // Wait until the target iframe has become the visible page and the
 // browser has recalculated the scrollable document height.
 const perform=()=>{
   if(activePage!=='informate')return;
   window.scrollTo(0,y);
 };
 requestAnimationFrame(()=>requestAnimationFrame(perform));
 setTimeout(perform,100);
 setTimeout(perform,350);
}
window.addEventListener('message',event=>{
 const data=event.data;
 if(data&&data.type==='HC_BREADCRUMB_REQUEST'){
   event.source.postMessage({type:'HC_BREADCRUMB_UPDATE',trail:breadcrumbTrail},'*');
   return;
 }
 if(data&&data.type==='HC_BREADCRUMB_NAVIGATE'&&pages[data.page]){
   if(Number.isInteger(data.index)&&breadcrumbTrail[data.index]===data.page){
     breadcrumbTrail=breadcrumbTrail.slice(0,data.index+1);
   }
   activate(data.page);
   broadcastBreadcrumb();
   return;
 }
 if(!data||data.type!=='HC_NAVIGATE'||!pages[data.page])return;
 // Older duplicated InDesign handlers also send an untargeted navigation
 // after a hand click. Do not let those messages reset the scroll to top.
 if(!data.target&&data.page==='informate'&&Date.now()-lastDeepLinkAt<900)return;
 if(data.target==='buscador'||data.target==='juego'){
   lastDeepLinkAt=Date.now();
   pendingDeepLink={page:data.page,target:data.target};
 }
 if(breadcrumbTrail[breadcrumbTrail.length-1]!==data.page)breadcrumbTrail.push(data.page);
 activate(data.page);
 broadcastBreadcrumb();
 if(pendingDeepLink&&activePage===pendingDeepLink.page){
   jumpToSection(pendingDeepLink.page,pendingDeepLink.target);
   pendingDeepLink=null;
 }
});
Object.keys(pages).forEach(key=>{
 const f=document.getElementById(key+'Frame');
 f.addEventListener('load',()=>{
  if(pendingDeepLink&&activePage===pendingDeepLink.page){
   jumpToSection(pendingDeepLink.page,pendingDeepLink.target);
   pendingDeepLink=null;
  }
 });
});
window.addEventListener('resize',()=>Object.keys(pages).forEach(fit));
</script></body></html>
